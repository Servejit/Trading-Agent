name: Scheduled Paper Trader

on:
  schedule:
    # GitHub Actions uses UTC. These runs cover 09:00–09:15 IST and retry
    # missed/late quotes every five minutes during the intended window.
    - cron: "*/5 3-4 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-paper-trader
  cancel-in-progress: false

jobs:
  run-paper-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install scheduler dependencies
        run: python -m pip install --upgrade pip pandas yfinance cryptography

      - name: Run due paper-trade action
        env:
          TRADING_AGENT_ENCRYPTION_KEY: ${{ secrets.TRADING_AGENT_ENCRYPTION_KEY }}
        run: python scheduler.py

      - name: Persist scheduler state
        run: |
          if ! git diff --quiet -- paper_scheduler_state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add paper_scheduler_state.json
            git commit -m "Update scheduled paper-trade state"
            git push
          fi
